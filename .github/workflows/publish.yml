name: Publish Dev Container

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version, e.g. 2026.1"
        required: true
        default: "2026.1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Dev Container
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/linkhack/bif-big-data-devcontainer
          imageTag: ${{ inputs.version }},latest
          push: always
